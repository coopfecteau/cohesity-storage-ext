name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.14 only. ActiveGate 1.347 stopped shipping the 3.10 interpreter, so testing
          # against 3.10 would prove something about a runtime that no longer exists.
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "dt-extensions-sdk[cli]" pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "dt-extensions-sdk[cli]"

      - name: Generate throwaway signing certificates
        # CI proves the package assembles and signs. A release build is signed with the real
        # developer certificate, which never lives in this repository.
        run: dt-sdk gencerts

      - name: Build
        # manylinux2014_x86_64 is what makes the package work on a Linux ActiveGate when the
        # developer builds on Windows.
        run: dt-sdk build -e manylinux2014_x86_64 -p 3.14

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error
