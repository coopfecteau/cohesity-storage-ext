name: custom:cohesity.storage
version: 0.1.9
# Floor settled by ticket 03 against the release-tagged schema repo, not guessed. The binding
# constraint is documents.screens (1.341); openpipeline smartscape lands earlier, at 1.330.
minDynatraceVersion: "1.341.0"
# Python 3.14 is an ActiveGate constraint, so it belongs here rather than in
# minDynatraceVersion. The schema marks this key "Experimental"; Dynatrace's own Palo Alto
# extension sets it anyway.
minEECVersion: 1.333.0
author:
  name: Cooper Fecteau

python:
  runtime:
    module: cohesity_storage
    version:
      # 3.14 only. ActiveGate 1.347 stopped shipping the 3.10 interpreter and began rolling
      # out 2026-09-08, five weeks ahead of 3.10's nominal EOL, so 3.10 builds already fail.
      min: "3.14"

  # Remote only: Cohesity is an appliance and no OneAgent can run on it, so there is no local
  # host to activate from. Same reasoning as custom:ssh.command.logs and as the Dell Isilon
  # vendor extension, which is the closest precedent.
  activation:
    remote:
      path: activationSchema.json

  # ONE collection switch, not two (ticket 06). The per-cluster toggles in
  # activationSchema.json are the source of truth for what is collected; the feature sets below
  # mirror them one for one, same names, same scope, and exist only because every metric key
  # has to belong to one. Leave them all enabled and switch collection per cluster.
  #
  # Two switches that can disagree produce "metric missing, both switches look fine", which is
  # a support call nobody can answer - so if you add a feature set here, add the matching
  # toggle there in the same commit, and vice versa.
  #
  # Cluster metrics sit in "default" on purpose. "default" cannot be switched off, and cluster
  # metrics are not optional: they carry the cluster id and name that every other entity's
  # dimensions are namespaced against, and collection_success is the only signal separating
  # "Cohesity is healthy" from "the extension is broken".
  featureSets:
    - featureSet: default
      metrics:
        - key: cohesity.cluster.collection_success
        - key: cohesity.cluster.capacity.total
        - key: cohesity.cluster.capacity.used
        - key: cohesity.cluster.capacity.available
        - key: cohesity.cluster.usage.logical
        - key: cohesity.cluster.usage.physical
        - key: cohesity.cluster.cpu.usage
        - key: cohesity.cluster.memory.usage
        - key: cohesity.cluster.io.iops
        - key: cohesity.cluster.io.latency
        - key: cohesity.cluster.garbage.bytes
    # Mirrors collectStorageDomains.
    - featureSet: storage_domains
      metrics:
        - key: cohesity.storagedomain.usage.logical
        - key: cohesity.storagedomain.usage.physical
        - key: cohesity.storagedomain.resiliency.bytes
    # Mirrors collectViews. View is dimensions rather than an entity (ticket 05), so the key
    # lives under the cluster prefix and binds to the cluster entity.
    - featureSet: views
      metrics:
        - key: cohesity.cluster.view.throughput
    # Mirrors collectProtection. The most expensive collection on a large estate.
    - featureSet: protection
      metrics:
        - key: cohesity.protectiongroup.run.outcome
        - key: cohesity.protectiongroup.run.duration
        - key: cohesity.protectiongroup.run.bytes_written
        - key: cohesity.protectiongroup.run.bytes_logical
        - key: cohesity.protectiongroup.run.objects
        - key: cohesity.protectiongroup.last_success.age
    # Mirrors collectHostLink. OFF by default - the only feature set that is. It carries
    # one series per protected VM, which is the cardinality ticket 04 ruled out of v1, so
    # it is asked for rather than assumed. See the README on bounded scale.
    - featureSet: host_link
      metrics:
        - key: cohesity.protectiongroup.protects

# Metric-key PREFIX is what binds a metric to its Smartscape entity: the node-extraction rules
# in openpipeline/metrics.pipeline.json match on `cohesity.cluster.*`,
# `cohesity.storagedomain.*` and `cohesity.protectiongroup.*`. The prefixes below are therefore
# topology configuration, not a readable grouping - renaming one detaches every metric under it
# from its entity, silently. Keep them in step with cohesity_storage/metrics.py, which a test
# asserts.
metrics:
  # -- cluster ------------------------------------------------------------
  - key: cohesity.cluster.capacity.total
    metadata:
      displayName: Cohesity cluster total capacity
      description: Raw physical capacity of the cluster, before deduplication or compression
      unit: Byte
  - key: cohesity.cluster.capacity.used
    metadata:
      displayName: Cohesity cluster used capacity
      description: Physical capacity consumed on local storage across the cluster
      unit: Byte
  - key: cohesity.cluster.capacity.available
    metadata:
      displayName: Cohesity cluster available capacity
      description: Physical capacity still free on local storage across the cluster
      unit: Byte
  - key: cohesity.cluster.usage.logical
    metadata:
      displayName: Cohesity cluster logical usage
      description: Logical (pre-reduction) bytes stored, split by service - dataprotect or fileservices
      unit: Byte
  - key: cohesity.cluster.usage.physical
    metadata:
      displayName: Cohesity cluster physical usage
      description: Physical (post-reduction) bytes stored, split by service - dataprotect or fileservices
      unit: Byte
  - key: cohesity.cluster.cpu.usage
    metadata:
      displayName: Cohesity cluster CPU usage
      description: Cluster-wide CPU utilisation, averaged over the rollup interval
      unit: Percent
  - key: cohesity.cluster.memory.usage
    metadata:
      displayName: Cohesity cluster memory usage
      description: Cluster-wide memory utilisation, averaged over the rollup interval
      unit: Percent
  - key: cohesity.cluster.io.iops
    metadata:
      displayName: Cohesity cluster IOPS
      description: Cluster I/O operations per second, split by operation - read or write
      unit: Count
  - key: cohesity.cluster.io.latency
    metadata:
      displayName: Cohesity cluster I/O latency
      # Microseconds, not milliseconds, and deliberately not converted: flash-backed Cohesity
      # routinely serves sub-millisecond, so dividing by 1000 rounds away the whole signal.
      description: Cluster I/O latency in microseconds, split by operation - read or write
      unit: MicroSecond
  - key: cohesity.cluster.garbage.bytes
    metadata:
      displayName: Cohesity cluster garbage
      description: Bytes held by data awaiting garbage collection, which capacity planning must not count as free
      unit: Byte
  - key: cohesity.cluster.view.throughput
    metadata:
      displayName: Cohesity view throughput
      description: Bytes read or written by each of the top views by activity, as a cluster-scoped measurement
      unit: Byte
  - key: cohesity.cluster.collection_success
    metadata:
      displayName: Cohesity collection success
      # Alert on the ABSENCE of a 1, never on a 0. A pre-identity failure reports under the
      # configured cluster name rather than the discovered one, so the failure series is a
      # different series from the success series.
      description: 1 when the cluster API answered this interval, otherwise 0
      unit: Count

  # -- storage domain -----------------------------------------------------
  - key: cohesity.storagedomain.usage.logical
    metadata:
      displayName: Cohesity storage domain logical usage
      description: Logical (pre-reduction) bytes stored in the storage domain
      unit: Byte
  - key: cohesity.storagedomain.usage.physical
    metadata:
      displayName: Cohesity storage domain physical usage
      description: Physical (post-reduction) bytes stored on local tiers of the storage domain
      unit: Byte
  - key: cohesity.storagedomain.resiliency.bytes
    metadata:
      displayName: Cohesity storage domain resiliency overhead
      description: Bytes consumed by erasure coding or replication in the storage domain's local tier
      unit: Byte

  # -- protection group ---------------------------------------------------
  - key: cohesity.protectiongroup.run.outcome
    metadata:
      displayName: Cohesity protection run outcome
      # A delta counter of newly-completed runs, dimensioned by terminal status - not a 0/1
      # gauge. A gauge would keep asserting the last outcome long after the run ended and would
      # make two failures in one interval indistinguishable from one.
      description: Count of protection runs that reached a terminal status this interval, split by status
      unit: Count
  - key: cohesity.protectiongroup.run.duration
    metadata:
      displayName: Cohesity protection run duration
      description: Wall-clock time from start to end of a completed protection run
      unit: MilliSecond
  - key: cohesity.protectiongroup.run.bytes_written
    metadata:
      displayName: Cohesity protection run bytes written
      description: Physical bytes written to the cluster by a completed protection run
      unit: Byte
  - key: cohesity.protectiongroup.run.bytes_logical
    metadata:
      displayName: Cohesity protection run logical bytes
      description: Logical size of the data a completed protection run protected, before reduction
      unit: Byte
  - key: cohesity.protectiongroup.run.objects
    metadata:
      displayName: Cohesity protection run objects
      description: Objects in a completed protection run, split by result - success or total
      unit: Count
  - key: cohesity.protectiongroup.protects
    metadata:
      displayName: Cohesity protected object link
      # A constant 1 that exists only to carry identity. Nothing charts it: the pair
      # (cohesity.protectiongroup.id, cohesity.object.uuid) is read back out of Grail by the
      # host-link workflow, which turns it into the OpenPipeline lookup table that draws the
      # protection group -> HOST edge. Unit Count because the line protocol needs one, not
      # because counting these means anything.
      description: Always 1 - carries the VMware BIOS UUID of one object a protection group backs up, so it can be joined to a Dynatrace HOST
      unit: Count
  - key: cohesity.protectiongroup.last_success.age
    metadata:
      displayName: Cohesity time since last successful run
      # The half of the contract that carries silence. A counter cannot report the run that
      # never started; this gauge is defined at every instant, and the
      # cohesity.protectiongroup.paused dimension tells a deliberate pause apart from a broken
      # schedule.
      description: Time since this protection group last finished successfully
      unit: MilliSecond

# Smartscape entities come from OpenPipeline, NOT from a classic `topology:` section - that
# path is deprecated since 1.334, and on Gen3 there is no REST entity-creation API either, so
# node and edge extraction off the metric stream is the mechanism. Node types must carry an
# EXT_ (or CUSTOM_) prefix: bare COHESITY_* is rejected server-side by a rule the published
# settings schema never mentions. See ticket 02.
openpipeline:
  sources:
    - displayName: Cohesity storage
      sourcePath: openpipeline/metrics.source.json
      configScope: metrics
  pipelines:
    - displayName: Cohesity storage
      pipelinePath: openpipeline/metrics.pipeline.json
      configScope: metrics
    # The second pipeline runs on DYNATRACE's host metrics, not on this extension's. That is
    # why it cannot be a stage of the one above: the source object routes this extension's
    # metrics to that pipeline statically, and a host metric never enters it. Reaching host
    # metrics needs a routing entry on the built-in metrics ingest, which an extension package
    # cannot create - so this ships inert (empty lookup tables) and the routing entry plus the
    # workflow that fills the tables are installed once, by hand. See dynatrace/README.md.
    - displayName: Cohesity host link
      pipelinePath: openpipeline/host-link.pipeline.json
      configScope: metrics

# Ship the dashboard under the MODERN `documents:` key, not the legacy `dashboards:` one.
# Dashboards Classic is deprecated since January 2026 with removal from SaaS targeted for end
# of 2027, and a Gen3 tenant may not have it at all - a `dashboards:` entry there installs
# nothing and says nothing. Limit is 10 dashboard definitions per extension.
documents:
  dashboards:
    - displayName: Cohesity Storage
      path: documents/cohesity-storage.dashboard.json
